<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>component-002</title>
    <!-- demo-page styles only; the component itself never touches
         html/body, so it can't clash with a host site's own CSS -->
    <style>
      body {
        margin: 0;
        background: #0e0e0e;
      }
    </style>
  </head>
  <body>
    <div id="mfa-root"></div>

    <div id="tpl-mfa-project-info" hidden>
      <div class="mfa-project-info">
        <div data-arc class="mfa-project-info__arc"></div>
        <div class="mfa-project-info__mask mfa-project-info__mask--duration">
          <div data-duration-track class="mfa-project-info__track"></div>
        </div>
      </div>
    </div>

    <!-- one slide, repeated by main.js -->
    <div id="tpl-mfa-slide" hidden>
      <div class="mfa-slide">
        <div class="mfa-slide__caption">
          <p data-caption class="mfa-slide__caption-text"></p>
        </div>
        <div class="mfa-slide__media">
          <img alt="" class="mfa-slide__image" draggable="false" />
          <div class="mfa-slide__shade" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
