<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>component-002</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Static markup lives here as templates; main.js clones them into
         #app and fills the dynamic bits (image src/alt, captions). -->

    <!-- active project info: title arc + duration ticker -->
    <template id="tpl-project-info">
      <div class="project-info">
        <div data-arc class="project-info__arc"></div>
        <div class="project-info__mask project-info__mask--duration">
          <div data-duration-track class="project-info__track"></div>
        </div>
      </div>
    </template>

    <!-- one slide, repeated by main.js -->
    <template id="tpl-slide">
      <div class="slide">
        <div class="slide__caption">
          <p data-caption class="slide__caption-text"></p>
        </div>
        <div class="slide__media">
          <img alt="" class="slide__image" draggable="false" />
          <div class="slide__shade" aria-hidden="true"></div>
        </div>
      </div>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
