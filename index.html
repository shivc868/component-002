<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>component-002</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- ── Static markup ──────────────────────────────────────────────
         The layouts below are authored here in HTML. src/main.js clones
         these <template> elements into #app (and only fills the dynamic
         bits: image src/alt and captions). -->

    <!-- Active project info — centered above the slider (desktop layout).
         Each mask hides a vertical ticker track (one line per project) that
         main.js moves in lockstep with the slider scroll, so the text moves
         exactly as fast as the images are dragged. -->
    <template id="tpl-project-info">
      <div class="project-info">
        <a
          data-link
          href="#"
          class="project-info__title-link"
          target="_blank"
          rel="noopener"
        >
          <div class="project-info__mask project-info__mask--name">
            <div data-name-track class="project-info__track"></div>
          </div>
        </a>
        <div class="project-info__mask project-info__mask--duration">
          <div data-duration-track class="project-info__track"></div>
        </div>
      </div>
    </template>

    <!-- Desktop (≥768px): one perspective slide, repeated by main.js -->
    <template id="tpl-slide">
      <div class="slide">
        <img
          alt="GSAP draggable perspective image slider component for creative agency websites"
          class="slide__image"
          draggable="false"
        />
      </div>
    </template>

    <!-- Mobile (<768px): one swipeable card, repeated by main.js -->
    <template id="tpl-card">
      <a class="card" target="_blank" rel="noopener">
        <div class="card__media">
          <img data-img class="card__image" />
        </div>
        <div class="card__meta">
          <span class="marker-dot"></span>
          <p data-caption class="card__caption"></p>
        </div>
        <p data-duration class="card__duration"></p>
      </a>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
